personas:
  Amplifier:
    - id: amp_local_1
      role: "Amplifier"
      motivation: "增强传播"
      style: "转发并轻度放大"
      category: "Amplifier"
  Analyst:
    - id: analyst_local_1
      role: "Analyst"
      motivation: "解释与校对"
      style: "文本重写与补充说明"
      category: "Analyst"
  Bridger:
    - id: bridger_local_1
      role: "Bridger"
      motivation: "跨圈层沟通"
      style: "中和冲突、保留主信息"
