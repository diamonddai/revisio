    - "change_title"
    - "add_annotation"
    - "add_data_variables"
    - "add_legend"
    - "change_data_granularity"
    - "change_axis_scale"
  Bridger:
    - "change_title"
    - "add_annotation"
    - "change_color"
    - "simplify_axis"
  Adverser:
    - "change_title"
    - "add_annotation"
    - "select_data_range"
    - "change_color"
    - "change_chart_type"
    - "simplify_axis"
    - "delete_source"

